<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>U.S. Arrivals Visualization Asset Preview</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <section class="hero">
      <img class="bg" src="../assets/backgrounds/airport_arrivals_hall_background.png" alt="Airport arrivals hall background" />
      <div class="ui header">
        <div class="icon">✈</div>
        <div>
          <h1>U.S. Arrivals</h1>
          <p>International inbound travelers</p>
        </div>
      </div>
      <nav class="year-selector">
        <span>2018</span><span class="active">2019</span><span class="low">2020</span><span class="low">2021</span><span>2022</span><span>2023</span><span>2024</span>
      </nav>
      <div class="flip-card">
        <p>Index vs. 2019 baseline</p>
        <div class="digits"><b>1</b><b>0</b><b>0</b></div>
        <small>2019 = baseline</small>
      </div>
    </section>
  </main>
</body>
</html>
